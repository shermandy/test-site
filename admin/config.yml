backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Include in main menu?",
              name: "tags",
              widget: "select",
              options: ["Yes"],
              multiple: true,
              required: false,
            }
          - {
              label: "Main Menu Order",
              name: "navOrder",
              widget: "number",
              default: 1,
            }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "layout.njk",
            }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "About Me"
        name: "about"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "Include in main menu?",
              name: "tags",
              widget: "select",
              options: ["Yes"],
              multiple: true,
              required: false,
            }
          - {
              label: "Main Menu Order",
              name: "navOrder",
              widget: "number",
              default: 2,
            }
          - {
              label: "Layout",
              name: "layout",
              widget: "hidden",
              default: "layout.njk",
            }
          - { label: "Body", name: "body", widget: "markdown" }
