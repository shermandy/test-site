backend:
  name: git-gateway
  branch: main

# Link to your live site displayed in the admin header
display_url: https://shermandy9191.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "content/index.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "layout.njk"
          # Define the reusable blocks list anchor
          - &blocks_field
            label: "Page Sections"
            name: "blocks"
            widget: "list"
            typeKey: "type"
            types:
              - label: "Three Card Section"
                name: "three_cards"
                widget: "object"
                fields:
                  - label: "Section Heading"
                    name: "heading"
                    widget: "string"
                    required: false
                  - label: "Cards"
                    name: "cards"
                    widget: "list"
                    min: 3
                    max: 3
                    fields:
                      - label: "Card Title"
                        name: "title"
                        widget: "string"
                      - label: "Card Body"
                        name: "content"
                        widget: "text"
                      - label: "Link URL"
                        name: "link"
                        widget: "string"
                        required: false

              - label: "Hero Banner"
                name: "hero_banner"
                widget: "object"
                fields:
                  - label: "Heading Text"
                    name: "heading"
                    widget: "string"
                  - label: "Content"
                    name: "content"
                    widget: "markdown"
                    modes: ["rich_text"]
                    buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                    editor_components: []
                  - label: "Links"
                    name: "links"
                    widget: "list"
                    required: false
                    min: 0
                    max: 2
                    fields:
                      - label: "Link URL"
                        name: "url"
                        widget: "string"
                      - label: "Link Text"
                        name: "text"
                        widget: "string"
                      - label: "Target"
                        name: "target"
                        widget: "select"
                        options:
                          - { label: "Same Tab", value: "_self" }
                          - { label: "New Tab", value: "_blank" }
                        required: false
                      - label: "Button Color"
                        name: "button_color"
                        widget: "select"
                        options:
                          - { label: "Primary", value: "primary" }
                          - { label: "Secondary", value: "secondary" }
                        required: false

              - label: "Rich Text Section"
                name: "rich_text"
                widget: "object"
                fields:
                  - label: "Content"
                    name: "body"
                    widget: "markdown"

      - label: "Our Story"
        name: "about"
        file: "content/story.md"
        # Anchor definition for modular standard internal pages
        fields: &standard_modular_fields
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Include in Main Menu?"
            name: "tags"
            widget: "select"
            options:
              - { label: "No", value: "" }
              - { label: "Yes", value: "nav" }
            default: "nav"
            multiple: false
            required: false
          - label: "Main Menu Order"
            name: "navOrder"
            widget: "number"
            default: 2
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "layout.njk"
          - label: "Permalink"
            name: "permalink"
            widget: "hidden"
            default: "/{{slug}}/"
          # Reuse the modular section block anchor
          - *blocks_field

      - label: "Media"
        name: "media"
        file: "content/media.md"
        fields: *standard_modular_fields

      - label: "Services"
        name: "services"
        file: "content/services.md"
        fields: *standard_modular_fields

      - label: "Donate"
        name: "donate"
        file: "content/donate.md"
        fields: *standard_modular_fields

      - label: "Volunteer"
        name: "volunteer"
        file: "content/volunteer.md"
        fields: *standard_modular_fields